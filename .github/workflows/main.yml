name: Compile Sing-Box SRS Ruleset

on:
  schedule:
    - cron: '0 8 * * *' # 每天北京时间早上 8 点自动运行
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 Action 向仓库提交代码的权限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Sing-Box (From GitHub Releases)
        run: |
          
          # 下载适用于 Ubuntu (Linux amd64) 的二进制压缩包
          curl -Lo singbox.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz"
          tar -zxf singbox.tar.gz
          sudo mv sing-box-1.14.0-linux-amd64/sing-box /usr/local/bin/
          
          # 4. 验证安装
          sing-box version

      - name: Download and Convert IPCIDR
        run: |
          # 1. 下载指定的 cn_ipv4.txt 文件 
          curl -sSL "https://github.com/DustinWin/ruleset_geodata/releases/download/sing-box-ruleset/cnip.json" -o cnip.json
          
          # 2. 将 IP 列表解析并构造为 sing-box 的 JSON 规则格式
          # 过滤掉空行和注释行
          mkdir -p ruleset
          jq '.version = 2 | walk(if type == "object" and has("ip_cidr") then .ip_cidr |= map(select(contains(":") | not)) else . end)' cnip.json > ruleset/cn_ipv4.json

          # 3. 创建输出目录并将 JSON 编译为二进制 SRS
          sing-box rule-set compile ruleset/cn_ipv4.json -o ruleset/cn_ipv4.srs

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查文件是否有变化，有变化则提交
          if [ -n "$(git status --porcelain ruleset/cn_ipv4.srs)" ]; then
            git add ruleset/
            git commit -m "chore: update cn_ipv4 srs ruleset [skip ci]"
            git push
          else
            echo "No changes detected in ruleset."
          fi
